<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VendSource AI Vending Machines</title>
    <!-- Favicon. Multi-resolution .ico (16px through 256px), so the browser picks
         the size it needs for the tab, bookmarks bar and desktop shortcut. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- SEO Meta Tags -->
    <meta name="description" content="Meet Haha and Qingo by VendSource - AI-powered grab &amp; go smart vending coolers with load-cell shelves, computer vision, and Nayax payment integration." />
    <meta property="og:title" content="VendSource AI Vending Machines" />
    <meta property="og:description" content="Double retail sales with frictionless Tap, Grab &amp; Go vending. Zero spirals, zero jams. Meet the Haha &amp; Qingo models." />
    <!--
      TODO before launch: og:image must be an ABSOLUTE url on the production
      domain (e.g. https://vendsourcedistribution.com/hero/vending-shelf.jpg).
      Facebook and LinkedIn do not resolve relative og:image paths.
    -->
    <meta property="og:image" content="/hero/vending-shelf.jpg" />
    <meta property="og:image:alt" content="Stocked VendSource smart vending cooler shelves" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VendSource AI Vending Machines" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html {
        scroll-behavior: smooth;
      }
    </style>
  </head>
  <body class="bg-white text-slate-900 antialiased overflow-x-hidden selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
